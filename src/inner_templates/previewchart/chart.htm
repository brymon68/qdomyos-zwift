<!doctype html>
<html lang="en-US">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>X22i Workout Charts</title>
    <script src="../chartjs/resize-observer.min.js"></script>
    <script src="../chartjs/jquery-3.6.0.min.js"></script>
    <script src="../chartjs/chartjs.3.4.1.min.js"></script>
    <script src="../chartjs/moment.js"></script>
    <script src="../chartjs/chartjs-adapter-moment.js"></script>
    <script src="../chartjs/chartjs-plugin-annotation.min.js"></script>
    <script src="../chartjs/globals.js"></script>
    <script src="main_ws_manager.js"></script>
    <script src="dochart.js"></script>
    <style>
        body { margin: 16px; background: #1d2330; color: white; font-family: sans-serif; }
        h1 { font-size: 24px; }
        .chart { background: white; border-radius: 10px; margin-top: 20px; overflow: hidden; }
        #loading { position: fixed; inset: 0; background: #ffffffb3; display: grid; place-items: center; }
    </style>
</head>
<body>
    <h1 class="workoutName">X22i workout</h1>
    <p class="workoutStartDate"></p>
    <p class="summary_distance"></p>
    <div class="chart"><canvas id="canvasHeart"></canvas></div>
    <div class="chart"><canvas id="canvasSpeedInclination"></canvas></div>
    <div id="loading"><img src="ajax-loader.gif" alt="Loading charts"></div>
</body>
</html>
