<!doctype html>
<html lang="en-US">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>X22i controls</title>
  <script src="jquery-3.6.0.min.js"></script>
  <script src="globals.js"></script>
  <script src="main_ws_manager.js"></script>
  <style>
    body { margin: 6px; color: white; background: #202020; font-family: sans-serif; }
    .metrics { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
    .metric { padding: 6px; background: #303030; border-radius: 4px; text-align: center; }
    .value { font-size: 22px; font-weight: bold; padding: 6px 0; }
    .controls { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
    button { border: 0; border-radius: 4px; padding: 8px; color: white; background: #4c70bf; cursor: pointer; }
    .stop { background: #b33030; }
  </style>
</head>
<body>
  <div class="metrics">
    <div class="metric">Speed <span id="speed-unit">mph</span><div class="value" id="speed">0.0</div><button onclick="command('speed_minus')">−</button> <button onclick="command('speed_plus')">+</button></div>
    <div class="metric">Incline %<div class="value" id="inclination">0.0</div><button onclick="command('inclination_minus')">−</button> <button onclick="command('inclination_plus')">+</button></div>
    <div class="metric">Pace<div class="value" id="pace">0:00</div></div>
    <div class="metric">Distance <span id="distance-unit">mi</span><div class="value" id="distance">0.00</div></div>
    <div class="metric">Elapsed<div class="value" id="elapsed">0:00:00</div></div>
    <div class="metric">Heart rate<div class="value" id="heart">0</div></div>
  </div>
  <div class="controls">
    <button onclick="command('start')">Start / Pause</button>
    <button class="stop" onclick="command('stop')">Stop</button>
    <button onclick="command('autoresistance')" id="automatic">Automatic incline</button>
    <button onclick="command('floating_close')">Close</button>
  </div>
  <script>
    var miles = 0.621371;
    function command(name) {
      const request = new MainWSQueueElement({msg: name}, function(message) {
        return message.msg === 'R_' + name ? message.content : null;
      }, 15000, 1);
      request.enqueue().catch(function(error) { console.error(error); });
    }
    function updateTelemetry(data) {
      $('#speed').text((Number(data.speed || 0) * miles).toFixed(1));
      $('#inclination').text(Number(data.inclination || 0).toFixed(1));
      $('#distance').text((Number(data.distance || 0) * miles).toFixed(2));
      $('#pace').text((data.pace_m || 0) + ':' + String(data.pace_s || 0).padStart(2, '0'));
      $('#elapsed').text((data.elapsed_h || 0) + ':' + String(data.elapsed_m || 0).padStart(2, '0') + ':' + String(data.elapsed_s || 0).padStart(2, '0'));
      $('#heart').text(Math.round(Number(data.heart || 0)));
      $('#automatic').text('Automatic incline ' + (data.autoresistance ? 'on' : 'off'));
    }
    function listenTelemetry() {
      const request = new MainWSQueueElement(null, function(message) {
        return message.msg === 'telemetry' ? message.content : null;
      }, 2000, 1);
      request.enqueue().then(function(data) {
        updateTelemetry(data);
        listenTelemetry();
      }).catch(function() { setTimeout(listenTelemetry, 1000); });
    }
    $(window).on('load', function() {
      const request = new MainWSQueueElement({msg: 'display_settings'}, function(message) {
        return message.msg === 'R_display_settings' ? message.content : null;
      }, 5000, 1);
      request.enqueue().then(function(settings) {
        miles = settings.miles_unit === false || settings.miles_unit === 'false' ? 1 : 0.621371;
        $('#speed-unit').text(miles === 1 ? 'km/h' : 'mph');
        $('#distance-unit').text(miles === 1 ? 'km' : 'mi');
      }).catch(function(error) { console.error(error); }).finally(listenTelemetry);
    });
  </script>
</body>
</html>
