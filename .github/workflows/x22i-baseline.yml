name: X22i ARM64 builds

on:
  workflow_dispatch:
    inputs:
      variant:
        description: App variant to build
        type: choice
        required: true
        default: test
        options:
          - test
          - baseline
  push:
    branches: [codex/x22i-no-trial]

permissions:
  contents: read

env:
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

concurrency:
  group: x22i-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      X22I_VARIANT: ${{ github.event_name == 'workflow_dispatch' && inputs.variant || 'test' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Test private settings and APK checks
        run: python3 -m unittest discover -s tools/x22i -p 'test_*.py' -v
      - name: Prepare test app signing key
        if: env.X22I_VARIANT == 'test'
        env:
          X22I_TEST_KEYSTORE_BASE64: ${{ secrets.X22I_TEST_KEYSTORE_BASE64 }}
          X22I_SIGNING_STORE_PASSWORD: ${{ secrets.X22I_TEST_KEYSTORE_PASSWORD }}
          X22I_SIGNING_STORE_FILE: ${{ runner.temp }}/x22i-test-signing.p12
        run: |
          python3 - <<'PY'
          import base64, binascii, os

          encoded = os.environ['X22I_TEST_KEYSTORE_BASE64'].strip()
          if not encoded or not os.environ['X22I_SIGNING_STORE_PASSWORD']:
              raise SystemExit('Test app signing secrets are not configured.')
          try:
              keystore = base64.b64decode(encoded, validate=True)
          except (ValueError, binascii.Error):
              raise SystemExit('Test app signing keystore is not valid base64.')
          if not keystore:
              raise SystemExit('Test app signing keystore is empty.')
          descriptor = os.open(os.environ['X22I_SIGNING_STORE_FILE'], os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
          with os.fdopen(descriptor, 'wb') as destination:
              destination.write(keystore)
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Qt host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential qtbase5-dev libgl1-mesa-dev libxkbcommon-x11-0 libxcb-xinerama0 libxcb-cursor0 libpulse-mainloop-glib0 rsync
      - name: Test X22i settings across upgrades
        run: |
          c++ -std=c++11 -fPIC tools/x22i/test_x22i_defaults.cpp \
            -o "$RUNNER_TEMP/test-x22i-defaults" $(pkg-config --cflags --libs Qt5Core)
          "$RUNNER_TEMP/test-x22i-defaults"
      - uses: jdpurcell/install-qt-action@v5
        with:
          version: '5.15.0'
          host: linux
          target: android
          arch: android
          modules: qtcharts qtnetworkauth
          dir: ${{ runner.temp }}/x22i-qt
          cache: true
          cache-key-prefix: x22i-baseline-qt
      - name: Install pinned Android packages
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'ndk;21.4.7075529' 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build fork source
        env:
          QT_ANDROID_DIR: ${{ runner.temp }}/x22i-qt/Qt/5.15.0/android
          X22I_BUILD_JOBS: '2'
          X22I_SIGNING_STORE_FILE: ${{ env.X22I_VARIANT == 'test' && format('{0}/x22i-test-signing.p12', runner.temp) || '' }}
          X22I_SIGNING_STORE_PASSWORD: ${{ env.X22I_VARIANT == 'test' && secrets.X22I_TEST_KEYSTORE_PASSWORD || '' }}
        run: bash tools/x22i/build_baseline.sh "$RUNNER_TEMP/x22i-build"
      - name: Remove test app signing key
        if: always()
        run: rm -f -- "$RUNNER_TEMP/x22i-test-signing.p12"
      - name: Upload APK and provenance
        uses: actions/upload-artifact@v4
        with:
          name: x22i-${{ env.X22I_VARIANT }}-arm64
          path: ${{ runner.temp }}/x22i-build/artifacts/
          if-no-files-found: error
          retention-days: 30
