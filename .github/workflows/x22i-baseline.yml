name: X22i ARM64 baseline

on:
  workflow_dispatch:
  push:
    branches: [codex/x22i-baseline]
    paths:
      - .github/workflows/x22i-baseline.yml
      - tools/x22i/**

permissions:
  contents: read

concurrency:
  group: x22i-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Test private settings and APK checks
        run: python3 -m unittest discover -s tools/x22i -p 'test_*.py' -v
      - name: Read pinned source revision
        id: baseline
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          pin = json.loads(Path('tools/x22i/baseline.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('source_revision=' + pin['source_revision'] + '\n')
          PY
      - uses: actions/checkout@v4
        with:
          repository: cagnulein/qdomyos-zwift
          ref: ${{ steps.baseline.outputs.source_revision }}
          path: baseline-source
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Qt host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgl1-mesa-dev libxkbcommon-x11-0 libxcb-xinerama0 libxcb-cursor0 libpulse-mainloop-glib0 rsync
      - uses: jdpurcell/install-qt-action@v5
        with:
          version: '5.15.0'
          host: linux
          target: android
          arch: android
          modules: qtcharts qtnetworkauth qtpurchasing
          dir: ${{ runner.temp }}/x22i-qt
          cache: true
          cache-key-prefix: x22i-baseline-qt
      - name: Install pinned Android packages
        run: sdkmanager 'ndk;21.4.7075529' 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build pinned gRPC baseline
        env:
          QT_ANDROID_DIR: ${{ runner.temp }}/x22i-qt/Qt/5.15.0/android
          X22I_BUILD_JOBS: '2'
        run: bash tools/x22i/build_baseline.sh "$GITHUB_WORKSPACE/baseline-source" "$RUNNER_TEMP/x22i-build"
      - name: Upload baseline APK and provenance
        uses: actions/upload-artifact@v4
        with:
          name: x22i-baseline-arm64
          path: ${{ runner.temp }}/x22i-build/artifacts/
          if-no-files-found: error
          retention-days: 30
